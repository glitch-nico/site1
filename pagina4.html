     <!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pedido de Encomenda</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f5f5f5; padding:20px; }
    .container { max-width:600px; margin:auto; background:white; padding:20px; border-radius:10px; box-shadow:0 0 10px #0002; }
    h1 { margin-top:0; }
    label { font-weight:bold; display:block; margin-top:15px; }
    input, textarea { width:100%; padding:10px; border:1px solid #ccc; border-radius:5px; margin-top:5px; }
    textarea { height:140px; resize:vertical; }
    button { margin-top:20px; width:100%; padding:12px; border:0; border-radius:6px; background:#0077ff; color:white; font-size:16px; cursor:pointer; }
    button:hover { background:#005fd4; }
    .success { padding:12px; background:#e6ffe6; border:1px solid #6fd36f; margin-top:20px; border-radius:6px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Faça sua Encomenda</h1>
    <p>Preencha o formulário abaixo com os detalhes da sua encomenda.</p>

    <form onsubmit="enviar(event)">
      <label>Seu nome:</label>
      <input id="nome" required>

      <label>Seu e-mail:</label>
      <input type="email" id="email" required>

      <label>Descreva sua encomenda:</label>
      <textarea id="mensagem" placeholder="Ex: Quero encomendar 20 camisetas tamanho M com estampa personalizada..." required></textarea>

      <button type="submit">Enviar Encomenda</button>
    </form>

    <div id="resultado"></div>
  </div>

  <script>
    function enviar(e) {
      e.preventDefault();
      const nome = document.getElementById('nome').value;
      const email = document.getElementById('email').value;
      const msg = document.getElementById('mensagem').value;

      document.getElementById('resultado').innerHTML = `
        <div class="success">
          <strong>Encomenda enviada!</strong><br>
          Obrigado, ${nome}. Entraremos em contato pelo e-mail <strong>${email}</strong>.<br><br>
          <u>Resumo da sua encomenda:</u><br>
          ${msg}
        </div>
      `;

      e.target.reset();
    }
  </script>
</body>
</html>
  </section>
</main>
