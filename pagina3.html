<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Área de Compras</title>
</head>
<body>
  <h1>Produtos</h1>
  <div id="products"></div>
  <a href="pagamento.html">Ir para pagamento</a>

  <script>
    const products = [
      { id: 'p1', title: 'crochê do Eevee + pokebola', price: 50.0 },
      { id: 'p2', title: 'crochê do Pochita', price: 30.0 },
      { id: 'p3', title: 'crochê do Aang', price: 130.0 }
    ];

    const fmt = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

    function addToCart(id){
      const cart = JSON.parse(localStorage.getItem('cart') || '{}');
      cart[id] = (cart[id] || 0) + 1;
      localStorage.setItem('cart', JSON.stringify(cart));
      alert('Item adicionado!');
    }

    function render(){
      const container = document.getElementById('products');
      products.forEach(p => {
        const div = document.createElement('div');
        div.innerHTML = `
          <strong>${p.title}</strong> — ${fmt(p.price)}
          <button onclick="addToCart('${p.id}')">Adicionar</button>
        `;
        container.appendChild(div);
      });
    }
    render();
  </script>

</body>
