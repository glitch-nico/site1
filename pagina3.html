<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página 3 - Produtos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Meu Site</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="pagina2.html">O que é kurogurumi?</a>
    <a href="pagina3.html" class="ativo">Produtos</a>
    <a href="pagina4.html">Encomende o seu!</a>
    <a href="pagina5.html">Comprar</a>
  </nav>
</header>

<main>
  <section class="container">
    <h2>Nossos Produtos</h2>

    <div id="products"></div>

    <a href="pagamento.html">Ir para pagamento</a>
  </section>
</main>

<footer>
  <p>&copy; 2025 Meu Site. Todos os direitos reservados.</p>
</footer>

<script>
  const products = [
    { id: 'p1', title: 'crochê do Eevee + pokebola', price: 50.0 },
    { id: 'p2', title: 'crochê do Pochita', price: 30.0 },
    { id: 'p3', title: 'crochê do Aang', price: 130.0 }
  ];

  const fmt = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

  function addToCart(id){
    const cart = JSON.parse(localStorage.getItem('cart') || '{}');
    cart[id] = (cart[id] || 0) + 1;
    localStorage.setItem('cart', JSON.stringify(cart));
    alert('Item adicionado!');
  }

  function render() {
    const container = document.getElementById("products");

    container.innerHTML = products.map(p => `
      <div class="produto">
        <h3>${p.title}</h3>
        <p>${fmt(p.price)}</p>
        <button onclick="addToCart('${p.id}')">Adicionar ao carrinho</button>
      </div>
    `).join('');
  }

  render();
</script>

</body>
</html>
