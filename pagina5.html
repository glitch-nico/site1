<main>
  <section class="container">
    <h2>Compra</h2>
    <div class="line">
</head>
<body>
  <h1>Resumo do Pedido</h1>
  <div id="cart"></div>
  <h2>Dados de Pagamento</h2>

  <form onsubmit="finalizar(event)">
    <label>Nome no cartão:<br>
      <input required>
    </label><br><br>

    <label>Número do cartão:<br>
      <input required maxlength="16">
    </label><br><br>

    <label>Validade:<br>
      <input required placeholder="MM/AA">
    </label><br><br>

    <label>CVV:<br>
      <input required maxlength="3">
    </label><br><br>

    <button type="submit">Finalizar Compra</button>
  </form>

  <script>
    const products = {
      p1: { title: 'Camiseta Básica', price: 59.9 },
      p2: { title: 'Caneca Estilosa', price: 29.5 },
      p3: { title: 'Mochila Compacta', price: 149.0 }
    };

    const fmt = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

    function loadCart(){
      const cart = JSON.parse(localStorage.getItem('cart') || '{}');
      const container = document.getElementById('cart');
      let total = 0;

      if(Object.keys(cart).length === 0){
        container.innerHTML = '<p>Carrinho vazio.</p>';
        return;
      }

      for(const id in cart){
        const qtd = cart[id];
        const prod = products[id];
        const sub = prod.price * qtd;
        total += sub;
        const div = document.createElement('div');
        div.innerHTML = `${prod.title} x ${qtd} — <strong>${fmt(sub)}</strong>`;
        container.appendChild(div);
      }

      const totalEl = document.createElement('h3');
      totalEl.textContent = 'Total: ' + fmt(total);
      container.appendChild(totalEl);
    }

    function finalizar(e){
      e.preventDefault();
      alert('Pagamento realizado com sucesso! (simulação)');
      localStorage.removeItem('cart');
      window.location.href = 'compras.html';
    }

    loadCart();
  </script>

<footer>

</footer>

</body>
    </html>
